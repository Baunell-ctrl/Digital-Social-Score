# Regle d'alerte Cloud Monitoring, condition en PromQL sur les metriques collectees par GMP.
# Creee par monitoring/setup_gke.sh (gcloud monitoring policies create --policy-from-file).
displayName: "DSS - CPU > 90 % de la demande"
combiner: OR
severity: WARNING
documentation:
  mimeType: text/markdown
  content: |
    Un pod de l'API utilise plus de 90 % du CPU demande depuis 5 minutes.

    A faire : kubectl get hpa dss-api ; si le HPA est a 10 pods, la capacite maximale est atteinte (environ 195 req/s).
conditions:
  - displayName: "DSS - CPU > 90 % de la demande"
    conditionPrometheusQueryLanguage:
      duration: 300s
      evaluationInterval: 60s
      labels:
        severity: warning
      query: |
        max by (pod_name) (kubernetes_io:container_cpu_request_utilization{monitored_resource="k8s_container",namespace_name="default",container_name="api"}) > 0.9
alertStrategy:
  autoClose: 1800s
notificationChannels: []    # rempli par setup_gke.sh (canal email)
