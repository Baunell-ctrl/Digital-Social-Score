# Regle d'alerte Cloud Monitoring, condition en PromQL sur les metriques collectees par GMP.
# Creee par deploy/monitoring.sh (gcloud monitoring policies create --policy-from-file).
displayName: "DSS - Aucun pod ne repond"
combiner: OR
severity: CRITICAL
documentation:
  mimeType: text/markdown
  content: |
    Aucun pod de l'API ne repond a la collecte Prometheus depuis 2 minutes : le service est probablement coupe.

    A faire : kubectl get pods -l app=dss-api ; kubectl describe deployment dss-api
conditions:
  - displayName: "DSS - Aucun pod ne repond"
    conditionPrometheusQueryLanguage:
      duration: 120s
      evaluationInterval: 60s
      labels:
        severity: critical
      query: |
        (sum(up{job="dss-api"}) or vector(0)) < 1
alertStrategy:
  autoClose: 1800s
notificationChannels: []    # rempli par deploy/monitoring.sh (canal email)
