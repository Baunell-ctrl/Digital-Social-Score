# Point d'entrée public de l'API sur GKE : load balancer HTTP de Google.
# - IP fixe "dss-ip" (gcloud compute addresses create dss-ip --global)
# - "/" : l'API et sa page web ; "/grafana" : Grafana (page de connexion, compte lecteur en lecture seule)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dss-api
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: dss-ip
spec:
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
  defaultBackend:
    service:
      name: dss-api
      port:
        number: 80
