# Réglages du load balancer côté pods : health check sur /health.
# Un pod qui ne répond pas est retiré du load balancer.
# logging : le load balancer journalise chaque requête AVEC l'IP du client (donnée personnelle,
# gardée 30 jours, déclarée dans le registre RGPD). Mettre enable: false pour ne plus les garder.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: dss-api
spec:
  # Défaut implicite du load balancer Google : 30 s, ce qui coïncide avec le plafond de latence
  # (P99 ~30 s) observé pendant l'attaque par coût asymétrique (TP2, étape 2). Avec le limiteur de
  # concurrence actif (MAX_CONCURRENT_SCORING), une requête admise ne devrait plus en approcher :
  # 15 s coupe plus tôt une requête anormalement bloquée et libère la connexion.
  timeoutSec: 15
  healthCheck:
    type: HTTP
    requestPath: /health
    port: 8080
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
  logging:
    enable: true
    sampleRate: 1.0
