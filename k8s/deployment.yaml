# API Digital Social Score sur GKE.
# IMAGE est remplacé au déploiement (voir README, étape 3 partie 4) :
#   sed "s|IMAGE|$IMAGE|" k8s/deployment.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dss-api
  labels:
    app: dss-api
spec:
  replicas: 2                      # 2 pods minimum : le service survit à la perte d'un pod
  selector:
    matchLabels:
      app: dss-api
  strategy:
    type: RollingUpdate            # mise à jour sans coupure : un nouveau pod prêt avant d'arrêter l'ancien
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: dss-api
    spec:
      automountServiceAccountToken: false   # l'API n'a pas besoin d'accéder à l'API Kubernetes
      # Étape 5 : les 2 pods tournaient sur le même nœud. On les répartit sur les zones de Paris
      # (a, b, c) : la panne d'une machine ou d'une zone ne coupe plus tout le service.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dss-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000            # utilisateur "app" créé dans le Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TRUSTED_PROXY_HOPS     # IP du client = avant-dernière entrée de X-Forwarded-For (Ingress GKE)
              value: "2"
            # API_KEY (une clé) et/ou API_KEYS ("nom:clé,nom:clé", une clé par client).
            # Les deux sont facultatives ici, mais l'API refuse de démarrer sans aucune clé.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: dss-secrets
                  key: API_KEY
                  optional: true
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: dss-secrets
                  key: API_KEYS
                  optional: true
            - name: LOG_SALT
              valueFrom:
                secretKeyRef:
                  name: dss-secrets
                  key: LOG_SALT
          resources:
            requests:              # ce que le pod réserve (et ce qui est facturé en Autopilot)
              cpu: "500m"
              memory: "1536Mi"
            limits:
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:            # laisse le temps de charger spaCy et le LSTM
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 24   # jusqu'à 2 minutes
          readinessProbe:          # le pod ne reçoit du trafic que s'il répond
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:           # redémarre le pod s'il est BLOQUÉ (pas seulement occupé)
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5      # étape 5 : avec 1 s, des pods saturés étaient redémarrés (erreurs 502)
            failureThreshold: 5    # environ 100 s sans réponse avant de redémarrer
